# ============================================================================
# Appolo v0.1 — Ultra-Realistic Ray Tracing Shader Pack for Minecraft 26.3
# Target Loaders: Iris Shaders, Sodium, Beddium/Embeddium & OptiFine
# ============================================================================

# --- Pipeline Feature Flags ---
separateAo=true
oldLighting=false
oldHandLight=false
dynamicHandLight=true
underwaterOverlay=false
vignette=false
sun=false
moon=false
stars=false
sky=false
rain.depth=true
shadowTerrain=true
shadowTranslucent=true
shadowEntities=true
shadowPlayer=true
shadowBlockEntities=true

# --- High-Resolution 2048x2048 Scientific & Astrophotography Atlas ---
texture.noise=textures/noisetex.png

# --- Per-Buffer Blending Configuration (Strict Uppercase GL Enum Names for Iris) ---
blend.gbuffers_terrain.colortex1=off
blend.gbuffers_terrain.colortex2=off
blend.gbuffers_terrain.colortex7=off
blend.gbuffers_entities.colortex1=off
blend.gbuffers_entities.colortex2=off
blend.gbuffers_entities.colortex7=off
blend.gbuffers_block.colortex1=off
blend.gbuffers_block.colortex2=off
blend.gbuffers_block.colortex7=off
blend.gbuffers_hand.colortex1=off
blend.gbuffers_hand.colortex2=off
blend.gbuffers_hand.colortex7=off
blend.gbuffers_water=off
blend.gbuffers_water.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_water.colortex1=off
blend.gbuffers_water.colortex2=off
blend.gbuffers_water.colortex3=off
blend.gbuffers_water.colortex7=off
blend.gbuffers_textured.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_textured.colortex1=off
blend.gbuffers_textured.colortex2=off
blend.gbuffers_textured.colortex7=off
blend.gbuffers_textured_lit.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_textured_lit.colortex1=off
blend.gbuffers_textured_lit.colortex2=off
blend.gbuffers_textured_lit.colortex7=off
blend.gbuffers_weather.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_weather.colortex1=off
blend.gbuffers_weather.colortex2=off
blend.gbuffers_weather.colortex7=off

# --- Slider Options ---
sliders=MILKY_WAY_INTENSITY NETHER_ATMOSPHERE_DENSITY BLOOM_INTENSITY RENDER_RESOLUTION GI_BOUNCE_INTENSITY AO_INTENSITY DYNAMIC_LAVA_LIGHT CAVE_DARKNESS_LEVEL SUNLIGHT_INTENSITY MOONLIGHT_INTENSITY GLASS_REFLECTION_BOOST OBSIDIAN_GLOSS WATER_WAVE_HEIGHT WATER_ABSORPTION_SCALE CLOUD_COVERAGE JUPITER_SCALE SATURN_SCALE SATURN_RING_DETAIL END_SUN_INTENSITY END_STAR_BRIGHTNESS PLANET_ROTATION_SPEED HEAT_HAZE_STRENGTH NETHER_STEAM_INTENSITY NETHER_EMBER_DENSITY LAVA_EMISSION_STRENGTH EXPOSURE_SPEED EXPOSURE_BIAS CONTRAST_LEVEL SATURATION_LEVEL TAA_SHARPENING SSR_MAX_STEPS VOLUMETRIC_STEPS CLOUD_MARCH_STEPS

# ============================================================================
# Profiles (Default = ULTRA_RT for Maximum Graphical Fidelity)
# ============================================================================
profile.ULTRA_RT=REFLECTION_QUALITY=4 SHADOW_QUALITY=4 GI_QUALITY=3 ATMOSPHERE_QUALITY=3 VOLUMETRIC_QUALITY=4 PLANET_RENDERING=3 STAR_DENSITY=4 MILKY_WAY_INTENSITY=1.25 NETHER_ATMOSPHERE_DENSITY=1.25 BLOOM_INTENSITY=0.35 RENDER_RESOLUTION=1.0 SSR_MAX_STEPS=48 VOLUMETRIC_STEPS=24 CLOUD_MARCH_STEPS=20
profile.EXTREME_CINEMATIC=REFLECTION_QUALITY=4 SHADOW_QUALITY=4 GI_QUALITY=3 ATMOSPHERE_QUALITY=3 VOLUMETRIC_QUALITY=4 PLANET_RENDERING=3 STAR_DENSITY=4 MILKY_WAY_INTENSITY=1.50 NETHER_ATMOSPHERE_DENSITY=1.40 BLOOM_INTENSITY=0.45 RENDER_RESOLUTION=1.0 SSR_MAX_STEPS=64 VOLUMETRIC_STEPS=32 CLOUD_MARCH_STEPS=28
profile.HIGH=REFLECTION_QUALITY=3 SHADOW_QUALITY=3 GI_QUALITY=2 ATMOSPHERE_QUALITY=2 VOLUMETRIC_QUALITY=3 PLANET_RENDERING=3 STAR_DENSITY=3 MILKY_WAY_INTENSITY=1.00 NETHER_ATMOSPHERE_DENSITY=1.00 BLOOM_INTENSITY=0.35 RENDER_RESOLUTION=1.0 SSR_MAX_STEPS=32 VOLUMETRIC_STEPS=16 CLOUD_MARCH_STEPS=16
profile.BALANCED=REFLECTION_QUALITY=2 SHADOW_QUALITY=2 GI_QUALITY=1 ATMOSPHERE_QUALITY=2 VOLUMETRIC_QUALITY=2 PLANET_RENDERING=2 STAR_DENSITY=2 MILKY_WAY_INTENSITY=1.00 NETHER_ATMOSPHERE_DENSITY=0.85 BLOOM_INTENSITY=0.30 RENDER_RESOLUTION=1.0 SSR_MAX_STEPS=24 VOLUMETRIC_STEPS=12 CLOUD_MARCH_STEPS=12

# ============================================================================
# User Interface Screens
# ============================================================================
screen.columns=2
screen=<profile> * [LIGHTING_SHADOWS] [PBR_REFLECTIONS] [OVERWORLD_SKY] [END_SOLAR_SYSTEM] [NETHER_HELLSCAPE] [CAMERA_POST] [PERFORMANCE_SCALE]

screen.LIGHTING_SHADOWS.columns=2
screen.LIGHTING_SHADOWS=SHADOW_QUALITY shadowMapResolution shadowDistance CONTACT_SHADOWS GI_QUALITY GI_BOUNCE_INTENSITY AO_INTENSITY DYNAMIC_LAVA_LIGHT CAVE_DARKNESS_LEVEL SUNLIGHT_INTENSITY MOONLIGHT_INTENSITY

screen.PBR_REFLECTIONS.columns=2
screen.PBR_REFLECTIONS=REFLECTION_QUALITY PBR_MODE GLASS_REFRACTION GLASS_REFLECTION_BOOST OBSIDIAN_GLOSS WATER_WAVE_HEIGHT WATER_CAUSTICS WATER_ABSORPTION_SCALE ROUGHNESS_FILTERING

screen.OVERWORLD_SKY.columns=2
screen.OVERWORLD_SKY=ATMOSPHERE_QUALITY VOLUMETRIC_QUALITY CLOUD_COVERAGE CLOUD_SHADOWS STAR_DENSITY MILKY_WAY_INTENSITY DEEP_SPACE_GALAXIES MOON_PHASE_LIGHTING

screen.END_SOLAR_SYSTEM.columns=2
screen.END_SOLAR_SYSTEM=PLANET_RENDERING JUPITER_SCALE SATURN_SCALE SATURN_RING_DETAIL EARTH_CITY_LIGHTS END_SUN_INTENSITY END_STAR_BRIGHTNESS PLANET_ROTATION_SPEED

screen.NETHER_HELLSCAPE.columns=2
screen.NETHER_HELLSCAPE=NETHER_ATMOSPHERE_DENSITY HEAT_DISTORTION HEAT_HAZE_STRENGTH NETHER_STEAM_INTENSITY NETHER_EMBER_DENSITY LAVA_EMISSION_STRENGTH

screen.CAMERA_POST.columns=2
screen.CAMERA_POST=TONEMAP_OPERATOR BLOOM_INTENSITY EXPOSURE_SPEED EXPOSURE_BIAS CONTRAST_LEVEL SATURATION_LEVEL TAA_ENABLED TAA_SHARPENING

screen.PERFORMANCE_SCALE.columns=2
screen.PERFORMANCE_SCALE=RENDER_RESOLUTION SSR_MAX_STEPS VOLUMETRIC_STEPS CLOUD_MARCH_STEPS
